
name: Build Nima X8 Java Emulator

on:
  workflow_dispatch:
  push:
    paths:
      - 'Nima-X8-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cd /tmp
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
          unzip -q tools.zip -d android-cli
          cp -r android-cli/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Extract project
        run: |
          mkdir source
          python3 -c "import zipfile; z=zipfile.ZipFile('Nima-X8-Source.zip'); z.extractall('source')"
          WRAPPER=$(find source -name gradlew -type f -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon clean :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nima-X8-Java-Emulator-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
