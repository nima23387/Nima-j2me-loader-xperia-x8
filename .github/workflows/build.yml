
name: Build Nima X8 Java Emulator

on:
  workflow_dispatch:
  push:
    paths:
      - 'Nima-X8-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Command Line Tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cd /tmp
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
          unzip -q tools.zip -d android-cli
          cp -r android-cli/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Extract Project
        run: |
          python3 - <<'PY'
          import zipfile
          import os

          with zipfile.ZipFile('Nima-X8-Source.zip') as archive:
              for item in archive.infolist():
                  name = item.filename.replace('\\', '/')
                  parts = name.split('/')

                  if name.startswith('/') or '..' in parts:
                      raise SystemExit('Unsafe ZIP path: ' + name)

                  target = os.path.join('source', *parts)

                  if item.is_dir() or name.endswith('/'):
                      os.makedirs(target, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with archive.open(item) as src:
                          with open(target, 'wb') as dst:
                              dst.write(src.read())

          print("ZIP extraction completed.")
          PY

          WRAPPER=$(find source -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar is missing!"
            exit 1
          fi

          echo "Gradle wrapper verified."

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          java -version
          ./gradlew --no-daemon clean :app:assembleRelease

      - name: Verify APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nima-X8-Java-Emulator-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
